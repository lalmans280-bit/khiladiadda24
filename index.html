<style>
  .rank-row {
    display: grid;
    grid-template-columns: minmax(0, 2.2fr) minmax(180px, 0.8fr);
    gap: 16px;
    align-items: stretch;
    margin-top: 18px;
  }
  .rank-panel {
    margin-top: 0;
  }
  .rank-chat-cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 100%;
    margin-top: 0;
    padding: 18px 16px;
    border: 1px solid rgba(56,189,118,0.38);
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(32,120,88,0.68), rgba(16,74,56,0.84));
    color: #f3fff8;
    text-decoration: none;
    font-weight: 800;
    letter-spacing: 0.02em;
    box-shadow: 0 8px 18px rgba(14, 53, 37, 0.28);
    text-align: center;
  }
  .rank-chat-cta:hover,
  .rank-chat-cta:focus-visible {
    filter: brightness(1.08);
    text-decoration: none;
  }

  @media (max-width: 640px) {
    .rank-row {
      grid-template-columns: 1fr;
    }
  }
</style>

<script>
  (function () {
    const content = document.querySelector('main.shell.content');
    if (content && !document.getElementById('view-rank')) {
      const section = document.createElement('section');
      section.id = 'view-rank';
      section.className = 'view';

      const rankRow = document.createElement('div');
      rankRow.className = 'rank-row';

      const panel = document.createElement('div');
      panel.id = 'rankSection';
      panel.className = 'panel rank-panel';
      panel.innerHTML = `
        <div class="rank-panel-head">
          <h2>🏆 Rank & Prize Pool</h2>
          <span id="rankMonth" class="rank-month-pill">Loading...</span>
        </div>
        <div class="rank-summary">
          <div class="rank-stat">
            <small>Prize pool</small>
            <strong id="rankPrizePool">Loading...</strong>
          </div>
          <div class="rank-stat">
            <small>Monthly reset</small>
            <strong>1st</strong>
          </div>
          <div class="rank-stat">
            <small>Your points</small>
            <strong id="myMonthlyPoints">-</strong>
          </div>
        </div>
        <ul id="monthlyRankList" class="rank-list"><li class="muted">Monthly rank load ho raha hai...</li></ul>
        <p class="muted" style="margin-top: 16px; color: #b7c5bf;">Har completed game par 5 points aur winner ko 15 extra points milte hain. Rank points se decide hota hai; monthly leaderboard 1st date ko reset hota hai.</p>
      `;

      const chatCta = document.createElement('a');
      chatCta.className = 'rank-chat-cta';
      chatCta.href = '/support.html';
      chatCta.setAttribute('aria-label', 'Open chat support');
      chatCta.textContent = '💬 Chat with support';

      rankRow.appendChild(panel);
      rankRow.appendChild(chatCta);
      section.appendChild(rankRow);
      content.appendChild(section);
    }
  })();
</script>
