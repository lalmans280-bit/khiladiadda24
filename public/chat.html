<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101713">
  <title>Need Chat - KhiladiAdda24</title>
  <style>
    :root{color-scheme:dark;font:16px/1.5 "Trebuchet MS",Verdana,sans-serif;background:#101713;color:#f2f5ef;--line:#33423f;--panel:#18232b;--gold:#f4c84b;--muted:#b8c4bc}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;padding:20px 12px 40px;background:radial-gradient(ellipse at 90% 0,#283f35 0,transparent 38%),linear-gradient(145deg,#101720,#111d25 60%,#182923)}
    main{display:grid;grid-template-rows:auto 1fr;width:min(100%,760px);min-height:calc(100vh - 60px);margin:0 auto}
    header{display:flex;align-items:center;gap:14px;padding:8px 0 18px}
    header a{display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--line);border-radius:8px;color:var(--gold);text-decoration:none;font-size:22px}
    h1,h2,p{margin:0}
    h1{color:var(--gold);font-size:22px}
    header p,.muted{color:var(--muted)}
    .chat{display:grid;grid-template-rows:auto minmax(180px,1fr) auto;min-height:0;padding:16px;border:1px solid var(--line);border-radius:10px;background:#18232be8}
    .chat-heading{padding-bottom:12px;border-bottom:1px solid var(--line)}
    .chat-heading h2{font-size:17px}
    .messages{display:grid;align-content:start;gap:10px;min-height:180px;max-height:calc(100vh - 310px);overflow:auto;margin:12px 0;padding:10px;border:1px solid var(--line);border-radius:8px;background:#101920}
    .bubble{max-width:90%;padding:10px;border-radius:9px;background:#263832;overflow-wrap:anywhere}
    .bubble.player{justify-self:end;background:#244e36}
    .bubble strong,.bubble small{display:block}
    .bubble small{margin-top:5px;color:var(--muted);font-size:12px}
    .attachment-preview{display:block;width:min(100%,360px);max-height:300px;margin-top:8px;border-radius:8px;object-fit:contain;cursor:zoom-in}
    label{display:block;margin:10px 0 5px}
    .attachment-zone{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
    .attachment-name{flex:1;min-width:160px;padding:8px 10px;border:1px solid #52685a;border-radius:8px;background:#101920;color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .attachment-trigger{background:#1d4f3a;color:#e7f9ef;border:1px solid rgba(255,255,255,0.15)}
    textarea,input[type=file],input[type=text]{width:100%;font:inherit}
    input[type=text],textarea{padding:10px;border:1px solid #52685a;border-radius:8px;color:inherit;background:#101920}
    textarea{min-height:76px;resize:vertical}
    input[type=file]{display:none}
    .composer-actions{display:flex;align-items:center;gap:12px;margin-top:10px}
    button{min-height:42px;padding:9px 16px;border:0;border-radius:7px;background:var(--gold);color:#172018;font:inherit;font-weight:800;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    #status{min-height:24px;margin-top:8px;color:var(--muted)}
    #status.error,.error{color:#ffaaa2}
    #preview{display:block;max-width:min(100%,220px);max-height:160px;margin-top:8px;border-radius:8px}
    [hidden]{display:none!important}
    @media(max-width:600px){body{padding:10px 8px 20px}main{min-height:calc(100vh - 30px)}.chat{padding:12px}.messages{max-height:calc(100vh - 290px)}}
  </style>
</head>
<body>
  <main>
    <header>
      <a href="/index.html" aria-label="App par wapas jaayein">←</a>
      <div><h1>Need Chat</h1></div>
    </header>
    <section class="chat" aria-labelledby="chatTitle">
      <div class="chat-heading"><h2 id="chatTitle">Customer Support</h2><p class="muted">Need help? Describe your issue and attach a screenshot if needed.</p></div>
      <p id="loginPrompt" hidden>Chat ke liye <a href="/login.html?next=%2Fchat.html">player login karein</a>.</p>
      <div id="chatArea" hidden>
        <div id="messages" class="messages" aria-live="polite"></div>
        <form id="chatForm">
          <label for="message">Aapka message</label>
          <textarea id="message" maxlength="1000" placeholder="Apni problem likhein..."></textarea>
          <label for="attachment">Attachment screenshot</label>
          <div class="attachment-zone">
            <span id="attachmentName" class="attachment-name">No screenshot selected</span>
            <button id="attachmentTrigger" type="button" class="attachment-trigger">📎 Attach screenshot</button>
            <input id="attachment" type="file" accept="image/jpeg,image/png,image/webp">
          </div>
          <img id="preview" alt="Screenshot preview" hidden>
          <div class="composer-actions"><button id="sendButton" type="submit">Message bhejein</button><span class="muted">Admin reply isi chat mein aayega.</span></div>
          <div id="status" role="status" aria-live="polite"></div>
        </form>
      </div>
    </section>
  </main>
  <script>
    const token = localStorage.getItem('token') || '';
    const chatArea = document.getElementById('chatArea');
    const loginPrompt = document.getElementById('loginPrompt');
    const messageList = document.getElementById('messages');
    const messageInput = document.getElementById('message');
    const attachmentInput = document.getElementById('attachment');
    const attachmentTrigger = document.getElementById('attachmentTrigger');
    const attachmentName = document.getElementById('attachmentName');
    const preview = document.getElementById('preview');
    const status = document.getElementById('status');
    const attachmentUrls = new Map();
    let refreshInFlight = false;

    chatArea.hidden = !token;
    loginPrompt.hidden = Boolean(token);

    async function loadMessages() {
      if (!token || refreshInFlight) return;
      refreshInFlight = true;
      try {
        const response = await fetch('/api/support/messages', {
          cache: 'no-store',
          headers: { Authorization: `Bearer ${token}` }
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Chat load nahi ho saki.');
        messageList.replaceChildren();
        if (!data.messages?.length) {
          const empty = document.createElement('p');
          empty.className = 'muted';
          empty.textContent = 'Namaste! Admin ko apna message ya screenshot bhejein.';
          messageList.appendChild(empty);
        }
        for (const item of data.messages || []) {
          const bubble = document.createElement('div');
          bubble.className = `bubble${item.senderRole === 'player' ? ' player' : ''}`;
          const sender = document.createElement('strong');
          sender.textContent = item.senderName || (item.senderRole === 'player' ? 'You' : 'Admin');
          bubble.appendChild(sender);
          if (item.text) {
            const text = document.createElement('div');
            text.textContent = item.text;
            bubble.appendChild(text);
          }
          if (item.attachment) {
            try {
              let imageUrl = attachmentUrls.get(item.id);
              if (!imageUrl) {
                const imageResponse = await fetch(item.attachment, {
                  headers: { Authorization: `Bearer ${token}` }
                });
                if (!imageResponse.ok) throw new Error('Screenshot load nahi ho saka.');
                imageUrl = URL.createObjectURL(await imageResponse.blob());
                attachmentUrls.set(item.id, imageUrl);
              }
              const image = document.createElement('img');
              image.className = 'attachment-preview';
              image.src = imageUrl;
              image.alt = 'Chat screenshot';
              const imageLink = document.createElement('a');
              imageLink.href = imageUrl;
              imageLink.target = '_blank';
              imageLink.rel = 'noopener noreferrer';
              imageLink.setAttribute('aria-label', 'Open full-size chat screenshot');
              imageLink.appendChild(image);
              bubble.appendChild(imageLink);
            } catch (error) {
              const errorText = document.createElement('small');
              errorText.textContent = error.message;
              bubble.appendChild(errorText);
            }
          }
          const time = document.createElement('small');
          time.textContent = new Date(item.createdAt).toLocaleString('en-IN');
          bubble.appendChild(time);
          messageList.appendChild(bubble);
        }
        messageList.scrollTop = messageList.scrollHeight;
      } catch (error) {
        showStatus(error.message || 'Chat load nahi ho saki.', true);
      } finally {
        refreshInFlight = false;
      }
    }

    attachmentTrigger.addEventListener('click', () => attachmentInput.click());

    attachmentInput.addEventListener('change', () => {
      const file = attachmentInput.files[0];
      preview.hidden = true;
      preview.removeAttribute('src');
      attachmentName.textContent = file ? file.name : 'No screenshot selected';
      if (!file) return;
      if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type) || file.size > 5 * 1024 * 1024) {
        attachmentInput.value = '';
        attachmentName.textContent = 'No screenshot selected';
        showStatus('JPEG, PNG ya WebP screenshot 5 MB ke andar select karein.', true);
        return;
      }
      preview.src = URL.createObjectURL(file);
      preview.hidden = false;
      showStatus('');
    });

    document.getElementById('chatForm').addEventListener('submit', async event => {
      event.preventDefault();
      const text = messageInput.value.trim();
      const file = attachmentInput.files[0];
      if (!text && !file) return showStatus('Message likhein ya screenshot attach karein.', true);
      const body = new FormData();
      body.set('text', text);
      if (file) body.set('attachment', file);
      const sendButton = document.getElementById('sendButton');
      sendButton.disabled = true;
      showStatus('Admin ko message bheja ja raha hai...');
      try {
        const response = await fetch('/api/support/messages', {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}` },
          body
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Message send nahi ho saka.');
        messageInput.value = '';
        attachmentInput.value = '';
        attachmentName.textContent = 'No screenshot selected';
        preview.hidden = true;
        preview.removeAttribute('src');
        showStatus('Message admin ko bhej diya gaya.');
        await loadMessages();
      } catch (error) {
        showStatus(error.message || 'Message send nahi ho saka.', true);
      } finally {
        sendButton.disabled = false;
      }
    });

    if (token) {
      loadMessages();
      setInterval(loadMessages, 5000);
    }
  </script>
</body>
</html>
