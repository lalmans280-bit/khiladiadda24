<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101713">
  <meta name="robots" content="noindex,follow">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/api/site-manifest">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/app-icon.svg" type="image/svg+xml">
  <link rel="shortcut icon" href="/app-icon.svg" type="image/svg+xml">
  <link rel="icon" href="/app-icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/app-icon-192.png">
  <link rel="mask-icon" href="/app-icon.svg" color="#f4c84b">
  <title>Login</title>
  <style>
    :root { color-scheme: light; --ink: #201918; --muted: #6f6a66; --red: #b20e16; --gold: #ffdc65; --green: #078b37; --line: #e6e2df; --error: #b42318; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; min-height: 100dvh; margin: 0; padding: 28px; display: grid; place-items: center; background: radial-gradient(ellipse at 10% 5%, #7c0c13, transparent 40%), linear-gradient(140deg, #21090b, #520b0d 52%, #21090b); color: var(--ink); font-family: Arial, sans-serif; }
    .login-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 450px); width: min(1040px, 100%); min-height: min(680px, calc(100dvh - 56px)); overflow: hidden; border: 1px solid #ffd66d78; border-radius: 22px; background: #fff; box-shadow: 0 28px 90px #0008; }
    .promo-panel { position: relative; display: flex; flex-direction: column; justify-content: space-between; min-height: 620px; overflow: hidden; padding: 0; color: #fff; background: radial-gradient(ellipse at 50% 30%, #fff08a80 0, #ffb00060 20%, transparent 48%), radial-gradient(ellipse at 50% 80%, #ffb000 0, transparent 38%), linear-gradient(155deg, #ff1744 0%, #f0003a 48%, #ad0039 100%); }
    .promo-panel::before, .promo-panel::after { position: absolute; width: 320px; height: 320px; border: 1px solid #ffdc6540; border-radius: 50%; content: ""; pointer-events: none; }
    .promo-panel::before { top: 28%; left: -175px; box-shadow: 0 0 0 24px #ffdc6512, 0 0 0 56px #ffdc650a; }
    .promo-panel::after { right: -210px; bottom: -90px; box-shadow: 0 0 0 24px #ffdc6512, 0 0 0 56px #ffdc650a; }
    .promo-panel::before { position: absolute; z-index: 0; right: 0; bottom: 0; left: 0; width: auto; height: 48px; border: 0; border-radius: 0; background-image: radial-gradient(circle, #fffbd0 0 2px, #ffdc65 3px 4px, transparent 8px), linear-gradient(176deg, transparent 0 44%, #ffdc6580 47%, transparent 51%); background-repeat: repeat-x, no-repeat; background-position: 0 11px, 0 0; background-size: 58px 28px, 100% 36px; content: ""; filter: drop-shadow(0 0 7px #ffe875); pointer-events: none; }     .promo-panel::after { position: absolute; z-index: 0; top: 22%; left: 50%; width: min(80%, 420px); height: 240px; border: 0; border-radius: 50%; background: #ffe15a30; content: ""; filter: blur(38px); pointer-events: none; transform: translateX(-50%); }     .fireflies { position: absolute; z-index: 2; inset: 0; overflow: hidden; pointer-events: none; }     .firefly { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #fff8ac; box-shadow: 0 0 7px 2px #fff080, 0 0 16px 5px #ffcf38a0; opacity: .3; }     .firefly:nth-child(1) { top: 15%; left: 12%; --drift: 24px -34px; }     .firefly:nth-child(2) { top: 23%; left: 81%; --drift: -29px -21px; animation-delay: -1.7s; }     .firefly:nth-child(3) { top: 38%; left: 24%; --drift: 32px 18px; animation-delay: -3.2s; }     .firefly:nth-child(4) { top: 46%; left: 72%; --drift: -18px 31px; animation-delay: -.8s; }     .firefly:nth-child(5) { top: 59%; left: 13%; --drift: 38px -25px; animation-delay: -2.6s; }     .firefly:nth-child(6) { top: 67%; left: 86%; --drift: -35px 20px; animation-delay: -4s; }     .firefly:nth-child(7) { top: 79%; left: 37%; --drift: 22px -29px; animation-delay: -1.1s; }     .firefly:nth-child(8) { top: 31%; left: 51%; --drift: -24px 34px; animation-delay: -3.7s; }     @keyframes garland-twinkle { 0%, 100% { opacity: .58; filter: drop-shadow(0 0 3px #ffe875); } 50% { opacity: 1; filter: drop-shadow(0 0 11px #fff3a1); } }     @keyframes firefly-drift { 0%, 100% { opacity: .18; transform: translate(0, 0) scale(.7); } 45% { opacity: 1; transform: translate(var(--drift)) scale(1.35); } }     @media (prefers-reduced-motion: no-preference) { .promo-panel::before { animation: garland-twinkle 1.4s ease-in-out infinite; } .firefly { animation: firefly-drift 5.2s ease-in-out infinite; } }
    .promo-art { position: relative; z-index: 1; display: block; width: 100%; height: auto; margin: 0; object-fit: contain; filter: drop-shadow(0 0 12px #fff080) drop-shadow(0 0 26px #ffb000a0); }
    .box { position: relative; align-self: stretch; width: 100%; overflow-y: auto; padding: clamp(25px, 4vw, 44px); background: #fff; font-weight: 700; }
    #adminModeLink { position: absolute; top: 17px; right: 19px; display: grid; width: 38px; min-height: 38px; padding: 0; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: #fff; color: #694d13; font-size: 16px; line-height: 1; text-decoration: none; }
    .login-heading { margin: 0 0 28px; text-align: center; }
    .login-logo { display: block; width: 88px; height: 88px; margin: 0 auto 12px; object-fit: contain; }
    .brand-tagline { margin: 0 0 6px; color: var(--red); font-size: 11px; font-weight: 900; letter-spacing: 1.6px; }
    .welcome-back { margin: 0 0 7px; color: var(--ink); font-size: 25px; }
    .security-note { margin: 0 0 12px; color: var(--muted); font-size: 12px; text-align: center; }
    .form-hint { margin: 0 0 18px; padding: 11px 12px; border: 1px solid #f1dfab; border-radius: 9px; color: #624714; background: #fff8e6; font-size: 13px; line-height: 1.5; text-align: center; overflow-wrap: anywhere; }
    label { display: block; margin: 15px 0 7px; color: #37312d; font-size: 13px; }
    input, button { width: 100%; min-height: 50px; margin: 7px 0; padding: 12px 14px; border-radius: 9px; font: inherit; }
    input { border: 1px solid #d5d0ca; background: #fff; color: var(--ink); font-size: 16px; transition: border-color .15s, box-shadow .15s; }
    input::placeholder { color: #948e87; }
    input:focus { border-color: var(--red); box-shadow: 0 0 0 3px #b20e1614; }
    input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid #e8ab27; outline-offset: 2px; }
    button { border: 0; background: linear-gradient(180deg, #0da846, #078331); color: #fff; font-weight: 800; cursor: pointer; box-shadow: 0 5px 12px #087c3030; transition: transform .15s, filter .15s; }
    button:not(:disabled):hover { transform: translateY(-1px); filter: brightness(1.05); }
    button.secondary { border: 1px solid #dad5d0; background: #fff; color: #39332e; box-shadow: none; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .login-modes { display: flex; justify-content: center; margin: -10px 0 22px; }
    .login-modes a { display: inline-flex; min-height: 34px; align-items: center; justify-content: center; padding: 6px 13px; border: 1px solid #d7e5d9; border-radius: 999px; color: #246236; background: #f1f8f2; font-size: 12px; font-weight: 800; text-decoration: none; }
    .login-modes #playerModeLink[aria-current="page"] { border-color: #b9d8bd; }
    .mode-label { display: inline-flex; }
    .mode-letter { color: inherit !important; }
    .login-pointer { display: none; }
    #adminModeLink[aria-current="page"] { border-color: #d3b970; background: #fff8e6; }
    #timerText { min-height: 20px; margin: 7px 0; color: var(--muted); font-size: 13px; text-align: center; }
    #msg { min-height: 22px; margin: 12px 0 0; color: #27623a; font-size: 13px; line-height: 1.5; text-align: center; overflow-wrap: anywhere; }
    #msg.error { color: var(--error); }
    .login-footnote { margin: 18px 0 0; color: var(--muted); font-size: 12px; font-weight: 400; line-height: 1.6; text-align: center; }
    .login-footnote a { color: #9c1720; font-weight: 700; }
    .hidden { display: none; }
    @media (max-width: 760px) {
      body { display: block; padding: 0; background: #fff; }
      .login-layout { display: flex; flex-direction: column; width: 100%; min-height: 100dvh; overflow: visible; border: 0; border-radius: 0; box-shadow: none; }
      .promo-panel { min-height: 0; padding: 0; border-radius: 0 0 25px 25px; }
      .promo-art { width: 100%; margin: 0; }
      .box { flex: 1; overflow: visible; padding: 26px 22px 30px; }
      .login-heading { margin-bottom: 22px; }
      .login-logo { width: 68px; height: 68px; }
      #adminModeLink { top: 14px; right: 17px; width: 34px; min-height: 34px; }
    }
    @media (max-width: 360px) {
      .box { padding-inline: 17px; }
    }
    @media (max-height: 560px) and (min-width: 761px) { body { padding-block: 12px; } .login-layout { min-height: 0; } .promo-panel { min-height: 560px; } .box { max-height: calc(100dvh - 24px); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="login-layout">
    <section class="promo-panel" aria-label="KhiladiAdda24 games">
      <img class="promo-art" src="/log-banner.png" alt="KhiladiAdda24 welcome bonus and Ludo games">       <div class="fireflies" aria-hidden="true">         <span class="firefly"></span><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span>         <span class="firefly"></span><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span>       </div>
    </section>
    <section class="box" aria-label="Player sign in">
      <a id="adminModeLink" href="/login.html?admin=1" aria-label="Admin login" title="Admin login"><span aria-hidden="true">&#128081;</span></a>
      <div class="login-heading">
        <img class="login-logo" src="/app-logo.png?v=20261008-2304" alt="KhiladiAdda24">
        <p class="brand-tagline">WELCOME TO KHILADIADDA24</p>
        <h2 class="welcome-back">Login or register</h2>
        <p class="security-note">Naye player? Mobile verify karke account banayein.</p>
      </div>
      <p class="form-hint" id="formHint" hidden></p>
      <nav class="login-modes" aria-label="Login type">
        <a id="playerModeLink" href="/login.html"><span class="mode-label" aria-label="Player">Player account</span></a>
      </nav>
      <form id="phoneForm" novalidate>
        <label for="phone">Mobile number</label>
        <input type="tel" id="phone" name="phone" placeholder="10 digit mobile number" inputmode="numeric" pattern="[6-9][0-9]{9}" maxlength="10" autocomplete="tel-national" required>
        <label for="referralCode">Referral ID <span style="color:#827b74;font-weight:400">(optional)</span></label>
        <input type="text" id="referralCode" name="referralCode" placeholder="8 character referral ID" maxlength="8" autocomplete="off" autocapitalize="characters">
        <button id="otpSendBtn" type="submit">Continue with mobile &rsaquo;</button>
        <p class="security-note">A one-time password will be sent to verify your mobile.</p>
      </form>
      <form id="otpForm" class="hidden" novalidate>
        <label for="otp">6-digit OTP</label>
        <input type="text" id="otp" name="otp" placeholder="SMS mein mila OTP" inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6" autocomplete="one-time-code" required>
        <div id="timerText" aria-live="polite"></div>
        <button id="otpVerifyBtn" type="submit">Login / Play</button>
        <button id="otpResendBtn" class="secondary" type="button" disabled>OTP dobara bhejein</button>
        <button id="changePhoneBtn" class="secondary" type="button">Mobile number badlein</button>
      </form>
      <p id="msg" role="status" aria-live="polite" aria-atomic="true"></p>
      
    </section>
  </main>

  <script>
    let otpTimer = null;
    let otpCooldown = 0;
    let expectedOtpLength = 6;
    const phoneForm = document.getElementById('phoneForm');
    const otpForm = document.getElementById('otpForm');
    const otpInput = document.getElementById('otp');
    const formHint = document.getElementById('formHint');
    const message = document.getElementById('msg');
    const loginMode = new URLSearchParams(location.search).get('admin') === '1' ? 'admin' : 'player';
    function playerDestination() {
      const next = new URLSearchParams(location.search).get('next');
      if (!next) return '/index.html';
      try {
        const target = new URL(next, location.origin);
        if (target.origin === location.origin && ['/index.html', '/support.html'].includes(target.pathname)) {
          return `${target.pathname}${target.search}${target.hash}`;
        }
      } catch {}
      return '/index.html';
    }
    const verifyButtonLabel = loginMode === 'admin' ? 'Admin panel mein login karein' : 'Verify OTP';
    document.getElementById(`${loginMode}ModeLink`).setAttribute('aria-current', 'page');
    formHint.textContent = loginMode === 'admin' ? 'Admin panel ke liye allowlisted mobile number se login karein.' : '';
    formHint.hidden = loginMode !== 'admin';
    document.getElementById('otpVerifyBtn').textContent = verifyButtonLabel;

    function setMessage(text, isError = false) {
      message.textContent = text;
      message.classList.toggle('error', isError);
    }

    function updateOtpButtons() {
      const waiting = otpCooldown > 0;
      document.getElementById('otpSendBtn').disabled = waiting;
      document.getElementById('otpSendBtn').textContent = waiting ? `OTP bhejein (${otpCooldown}s)` : 'Login with OTP';
      document.getElementById('otpResendBtn').disabled = waiting;
      document.getElementById('otpResendBtn').textContent = waiting ? `OTP dobara bhejein (${otpCooldown}s)` : 'OTP dobara bhejein';
      document.getElementById('timerText').textContent = waiting ? `Naya OTP ${otpCooldown}s baad bhej sakte hain.` : 'Naya OTP bhejne ke liye taiyar.';
    }

    function startOtpTimer() {
      if (otpTimer) clearInterval(otpTimer);
      otpCooldown = 60;
      updateOtpButtons();
      otpTimer = setInterval(() => {
        otpCooldown -= 1;
        updateOtpButtons();
        if (otpCooldown <= 0) {
          clearInterval(otpTimer);
          otpTimer = null;
        }
      }, 1000);
    }

    async function readResponse(res) {
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Request complete nahi hui. Dobara try karein.');
      return data;
    }

    function showRequestError(error) {
      const text = error instanceof TypeError
        ? 'Internet connection check karein aur dobara try karein.'
        : error.message || 'Kuch problem hui. Dobara try karein.';
      setMessage(text, true);
    }

    async function sendOtp(event) {
      event.preventDefault();
      const phone = document.getElementById('phone').value.trim();
      const referralCode = document.getElementById('referralCode').value.trim().toUpperCase();

      if (!/^[6-9]\d{9}$/.test(phone)) {
        return setMessage('Valid 10 digit Indian mobile number dalein.', true);
      }
      if (referralCode && !/^[A-Z0-9]{8}$/.test(referralCode)) {
        return setMessage('Referral ID 8 characters ki dalein.', true);
      }

      const sendButton = document.getElementById('otpSendBtn');
      const resendButton = document.getElementById('otpResendBtn');
      otpInput.value = '';
      expectedOtpLength = 6;
      sendButton.disabled = true;
      resendButton.disabled = true;
      setMessage('OTP bheja ja raha hai...');
      try {
        const res = await fetch('/api/auth/send-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, referralCode, loginMode })
        });
        const data = await readResponse(res);
        startOtpTimer();
        phoneForm.classList.add('hidden');
        otpForm.classList.remove('hidden');
        const testLogin = String(data.message || '').startsWith('Test login enabled.');
        const localOtp = String(data.message || '').match(/Use OTP\s+(\d+)/i);
        if (localOtp) expectedOtpLength = localOtp[1].length;
        formHint.textContent = testLogin ? data.message : `${phone} par bheja 6-digit OTP dalein.`;
        formHint.hidden = false;
        otpInput.focus();
        setMessage(testLogin ? 'Test OTP upar diya gaya hai.' : 'SMS mein aaye OTP ko yahan dalein.');
      } catch (error) {
        showRequestError(error);
        updateOtpButtons();
      }
    }

    async function verifyOtp(event) {
      event.preventDefault();
      const phone = document.getElementById('phone').value.trim();
      const otp = document.getElementById('otp').value.trim();
      if (!/^\d{4,6}$/.test(otp)) {
        return setMessage('Valid OTP dalein.', true);
      }

      const button = document.getElementById('otpVerifyBtn');
      button.disabled = true;
      button.textContent = 'Verify ho raha hai...';
      setMessage('OTP verify ho raha hai...');
      try {
        const res = await fetch('/api/auth/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, otp, loginMode, referralCode: document.getElementById('referralCode').value.trim().toUpperCase() })
        });
        const data = await readResponse(res);

        if (!data.user || !data.token) {
          throw new Error('Login response mein account details nahi mili. Dobara try karein.');
        }
        const finalUser = {
          ...data.user,
          role: loginMode === 'admin' || data.user.role === 'admin' ? 'admin' : 'user'
        };

        if (finalUser.role === 'admin') {
          localStorage.setItem('adminUser', JSON.stringify(finalUser));
          localStorage.setItem('adminToken', data.token);
          localStorage.setItem('user', JSON.stringify(finalUser));
          localStorage.setItem('token', data.token);
          window.location.href = '/admin.html';
        } else {
          localStorage.removeItem('adminUser');
          localStorage.removeItem('adminToken');
          localStorage.setItem('user', JSON.stringify(finalUser));
          localStorage.setItem('token', data.token);
          try { sessionStorage.setItem('showAppPromoAfterLogin', 'yes'); } catch {}
          window.location.href = playerDestination();
        }
      } catch (error) {
        showRequestError(error);
        button.disabled = false;
        button.textContent = verifyButtonLabel;
      }
    }

    phoneForm.addEventListener('submit', sendOtp);
    otpForm.addEventListener('submit', verifyOtp);
    otpInput.addEventListener('input', () => {
      if (otpInput.value.length === expectedOtpLength && !document.getElementById('otpVerifyBtn').disabled) {
        otpForm.requestSubmit();
      }
    });
    document.getElementById('otpResendBtn').addEventListener('click', sendOtp);
    document.getElementById('changePhoneBtn').addEventListener('click', () => {
      otpForm.classList.add('hidden');
      phoneForm.classList.remove('hidden');
      otpInput.value = '';
      formHint.textContent = loginMode === 'admin' ? 'Admin panel ke liye allowlisted mobile number se login karein.' : '';
      formHint.hidden = loginMode !== 'admin';
      setMessage('');
      document.getElementById('phone').focus();
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js').catch(error => {
        console.error('Service worker registration failed:', error);
      });
    }
    fetch('/api/site-branding').then(response => response.ok ? response.json() : null).then(branding => {
      if (!branding) return;
      const favicon = document.querySelector('link[rel="icon"]');
      const appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
      if (favicon && branding.appIcon192Url) favicon.href = branding.appIcon192Url;
      if (appleIcon && branding.appIcon192Url) appleIcon.href = branding.appIcon192Url;
    }).catch(() => {});
  </script>
  <script src="/i18n.js"></script>
  <script src="/player-copy.js" defer></script>
</body>
</html>
