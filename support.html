<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101713">
  <title>Support - KhiladiAdda24</title>
  <style>
    :root{color-scheme:dark;font:16px/1.5 Arial,sans-serif;background:#101713;color:#f2f5ef}
    *{box-sizing:border-box}
    body{margin:0;padding:20px 12px 40px}
    main{width:min(100%,720px);margin:0 auto}
    .card{margin:12px 0;padding:18px;border:1px solid #33423f;border-radius:12px;background:#18232b}
    h1,h2{margin:0 0 10px;color:#f4c84b}
    p{color:#c4cfca}
    a{color:#f4c84b}
    .chat-messages{display:grid;gap:10px;max-height:55vh;min-height:120px;overflow:auto;margin:14px 0;padding:10px;border:1px solid #33423f;border-radius:8px;background:#101920}
    .chat-bubble{max-width:90%;padding:10px;border-radius:9px;background:#263832;overflow-wrap:anywhere}
    .chat-bubble.player{justify-self:end;background:#244e36}
    .chat-bubble strong,.chat-bubble small{display:block}
    .chat-bubble small{margin-top:5px;color:#b8c4bc;font-size:12px}
    .chat-attachment{display:block;width:min(100%,360px);max-height:300px;margin-top:8px;border-radius:8px;object-fit:contain}
    label{display:block;margin:12px 0 5px}
    textarea,input[type=file]{width:100%;font:inherit}
    textarea{min-height:90px;padding:10px;border:1px solid #52685a;border-radius:8px;color:inherit;background:#101920;resize:vertical}
    input[type=file]{padding:8px;border:1px solid #52685a;border-radius:8px;background:#101920}
    button{min-height:42px;margin-top:12px;padding:9px 15px;border:0;border-radius:8px;background:#f4c84b;color:#172018;font:inherit;font-weight:700;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    #status{min-height:24px;color:#c4cfca}
    #status.error{color:#ffaaa2}
    #preview{display:block;max-width:min(100%,220px);max-height:160px;margin-top:8px;border-radius:8px}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>KhiladiAdda24 Support</h1>
      <p>Login, deposit, withdrawal ya game ki problem ho to message bhejein. Zarurat ho to screenshot attach karein.</p>
      <p>Support number: <a href="tel:+919179557295">+91 9179557295</a></p>
      <p><a href="/index.html">App par wapas jaayein</a></p>
    </section>
    <section class="card" aria-labelledby="chatTitle">
      <h2 id="chatTitle">Player Support Chat</h2>
      <p id="loginPrompt" hidden>Chat ke liye <a href="/login.html?next=%2Fsupport.html">player login karein</a>.</p>
      <div id="chatArea" hidden>
        <div id="messages" class="chat-messages" aria-live="polite"></div>
        <form id="chatForm">
          <label for="message">Aapka message</label>
          <textarea id="message" maxlength="1000" placeholder="Apni problem detail mein likhein..."></textarea>
          <label for="attachment">Screenshot (JPEG, PNG ya WebP; max 5 MB)</label>
          <input id="attachment" type="file" accept="image/jpeg,image/png,image/webp">
          <img id="preview" alt="Screenshot preview" hidden>
          <button id="sendButton" type="submit">Message bhejein</button>
          <div id="status" role="status" aria-live="polite"></div>
        </form>
      </div>
    </section>
  </main>
  <script>
    const token = localStorage.getItem('token') || '';
    const chatArea = document.getElementById('chatArea');
    const loginPrompt = document.getElementById('loginPrompt');
    const messageList = document.getElementById('messages');
    const messageInput = document.getElementById('message');
    const attachmentInput = document.getElementById('attachment');
    const preview = document.getElementById('preview');
    const status = document.getElementById('status');
    const attachmentUrls = new Map();
    let refreshInFlight = false;

    chatArea.hidden = !token;
    loginPrompt.hidden = Boolean(token);

    function showStatus(text, isError = false) {
      status.textContent = text;
      status.classList.toggle('error', isError);
    }

    async function loadMessages() {
      if (!token || refreshInFlight) return;
      refreshInFlight = true;
      try {
        const response = await fetch('/api/support/messages', {
          cache: 'no-store',
          headers: { Authorization: `Bearer ${token}` }
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Chat load nahi ho saki.');
        messageList.replaceChildren();
        if (!data.messages?.length) {
          const empty = document.createElement('p');
          empty.textContent = 'Namaste! Apna message ya screenshot bhejein.';
          messageList.appendChild(empty);
        }
        for (const item of data.messages || []) {
          const bubble = document.createElement('div');
          bubble.className = `chat-bubble${item.senderRole === 'player' ? ' player' : ''}`;
          const sender = document.createElement('strong');
          sender.textContent = item.senderName || (item.senderRole === 'player' ? 'You' : 'Support');
          bubble.appendChild(sender);
          if (item.text) {
            const text = document.createElement('div');
            text.textContent = item.text;
            bubble.appendChild(text);
          }
          if (item.attachment) {
            try {
              let imageUrl = attachmentUrls.get(item.id);
              if (!imageUrl) {
                const imageResponse = await fetch(item.attachment, {
                  headers: { Authorization: `Bearer ${token}` }
                });
                if (!imageResponse.ok) throw new Error('Screenshot load nahi ho saka.');
                imageUrl = URL.createObjectURL(await imageResponse.blob());
                attachmentUrls.set(item.id, imageUrl);
              }
              const image = document.createElement('img');
              image.className = 'chat-attachment';
              image.src = imageUrl;
              image.alt = 'Chat screenshot';
              bubble.appendChild(image);
            } catch (error) {
              const errorText = document.createElement('small');
              errorText.textContent = error.message;
              bubble.appendChild(errorText);
            }
          }
          const time = document.createElement('small');
          time.textContent = new Date(item.createdAt).toLocaleString('en-IN');
          bubble.appendChild(time);
          messageList.appendChild(bubble);
        }
        messageList.scrollTop = messageList.scrollHeight;
      } catch (error) {
        showStatus(error.message || 'Chat load nahi ho saki.', true);
      } finally {
        refreshInFlight = false;
      }
    }

    attachmentInput.addEventListener('change', () => {
      const file = attachmentInput.files[0];
      preview.hidden = true;
      preview.removeAttribute('src');
      if (!file) return;
      if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type) || file.size > 5 * 1024 * 1024) {
        attachmentInput.value = '';
        showStatus('JPEG, PNG ya WebP screenshot 5 MB ke andar select karein.', true);
        return;
      }
      preview.src = URL.createObjectURL(file);
      preview.hidden = false;
      showStatus('');
    });

    document.getElementById('chatForm').addEventListener('submit', async event => {
      event.preventDefault();
      const text = messageInput.value.trim();
      const file = attachmentInput.files[0];
      if (!text && !file) return showStatus('Message likhein ya screenshot attach karein.', true);
      const body = new FormData();
      body.set('text', text);
      if (file) body.set('attachment', file);
      const sendButton = document.getElementById('sendButton');
      sendButton.disabled = true;
      showStatus('Message bheja ja raha hai...');
      try {
        const response = await fetch('/api/support/messages', {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}` },
          body
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Message send nahi ho saka.');
        messageInput.value = '';
        attachmentInput.value = '';
        preview.hidden = true;
        preview.removeAttribute('src');
        showStatus('Message support team ko bhej diya gaya.');
        await loadMessages();
      } catch (error) {
        showStatus(error.message || 'Message send nahi ho saka.', true);
      } finally {
        sendButton.disabled = false;
      }
    });

    loadMessages();
    if (token) setInterval(loadMessages, 5000);
  </script>
</body>
</html>
